syntax = "proto3";

// EcoFlow Common Protocol Buffer Definitions
message EcoFlowHeader {
    optional bytes pdata = 1;
    optional int32 src = 2;
    optional int32 dest = 3;
    optional int32 d_src = 4;
    optional int32 d_dest = 5;
    optional int32 enc_type = 6;
    optional int32 check_type = 7;
    optional int32 cmd_func = 8;
    optional int32 cmd_id = 9;
    optional int32 data_len = 10;
    optional int32 need_ack = 11;
    optional int32 is_ack = 12;
    optional int32 seq = 14;
    optional int32 product_id = 15;
    optional int32 version = 16;
    optional int32 payload_ver = 17;
    oneof _time_snap {
        int32 time_snap = 18;
    }
    oneof _is_rw_cmd {
        int32 is_rw_cmd = 19;
    }
    oneof _is_queue {
        int32 is_queue = 20;
    }
    oneof _ack_type {
        int32 ack_type = 21;
    }
    oneof _code {
        string code = 22;
    }
    oneof _from {
        string from = 23;
    }
    oneof _module_sn {
        string module_sn = 24;
    }
    oneof _device_sn {
        string device_sn = 25;
    }
    oneof _src_sn {
        string src_sn = 26;
    }
    oneof _dest_sn {
        string dest_sn = 27;
    }
}

message EcoFlowSendHeaderMsg {
    repeated EcoFlowHeader msg = 1;
}
